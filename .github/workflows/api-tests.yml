name: API Tests

on:
  push:
    branches:
      - api-tests
      - main
  pull_request:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout autotests repository
        uses: actions/checkout@v4

      - name: Checkout test-service repository
        uses: actions/checkout@v4
        with:
          repository: sun6r0/test-service
          path: test-service

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Fix test-service migrations command
        working-directory: test-service
        run: |
          sed -i 's/, "3"//' docker-compose.yaml
          cat docker-compose.yaml

      - name: Start test-service
        working-directory: test-service
        run: docker compose up --build -d

      - name: Wait for test-service
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/api/time; then
              echo "test-service is available"
              exit 0
            fi

            echo "Waiting for test-service..."
            docker compose -f test-service/docker-compose.yaml ps
            sleep 3
          done

          echo "test-service did not start"
          docker compose -f test-service/docker-compose.yaml logs
          exit 1

      - name: Run API tests
        run: ./mvnw clean test -DbaseUrl=http://localhost:8080 -DbasePath=/api

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Stop test-service
        if: always()
        working-directory: test-service
        run: docker compose down -v